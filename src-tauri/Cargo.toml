[package]
name = "minmdeditor"
version = "0.1.0"
description = "Minimal Markdown editor with live preview, built with Tauri 2 + CodeMirror 6"
authors = ["kurong_slor"]
edition = "2021"

# 项目架构位置：
#   src-tauri/Cargo.toml —— Rust 侧的依赖清单，声明 Tauri 框架与插件。
#   Tauri 2 中插件需要同时出现在这里（Rust crate）和前端 package.json（JS 封装）中。
[lib]
# `_lib` 后缀用于避免库名与二进制名冲突（Windows 上的已知问题），
# 修改包名时必须同步修改 main.rs 中对库入口的引用。
name = "minmdeditor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
# 文件读写是自研命令（src-tauri/src/commands/），不走插件；
# dialog 插件只用于“打开文件夹”的原生目录选择对话框。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 发布构建优化，参考 Tauri 官方建议
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
